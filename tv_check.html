      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200 card-shadow">

        <p id="statPending" class="text-2xl font-bold text-amber-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200 card-shadow">
        <p class="text-xs font-semibold text-indigo-600">ความคืบหน้า (Progress)</p>
        <p id="statProgress" class="text-2xl font-bold text-indigo-600 mt-1">0%</p>
        <div class="w-full bg-slate-100 h-2 rounded-full mt-2 overflow-hidden">
          <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- FILTER & SEARCH BAR -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 card-shadow flex flex-col md:flex-row gap-3 justify-between items-center">
      <div class="relative w-full md:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
        <input type="text" id="searchInput" oninput="applyFilters()" placeholder="ค้นหาเลขห้อง (เช่น 5002, D101)..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div class="flex flex-wrap gap-2 w-full md:w-auto">
        <select id="filterStatus" onchange="applyFilters()" class="bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 font-medium focus:outline-none">
          <option value="ALL">สถานะการตรวจ: ทั้งหมด</option>
          <option value="DONE">เสร็จแล้ว (Done)</option>
          <option value="PENDING">ยังไม่เสร็จ (Pending)</option>
        </select>
        <select id="filterAvailable" onchange="applyFilters()" class="bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 font-medium focus:outline-none">
          <option value="ALL">ห้องพัก: ทั้งหมด</option>
          <option value="YES">Available (YES)</option>
          <option value="GUEST">Guest INH</option>
        </select>
      </div>
    </div>

            </tr>
          </thead>
          <tbody id="roomTableBody" class="divide-y divide-slate-100 bg-white">
            <!-- Table rows populated dynamically -->
          </tbody>
        </table>
      </div>
    </div>

    let roomsData = [];

    function initData() {
      const saved = localStorage.getItem('tv_check_data');
      if (saved) {
        roomsData = JSON.parse(saved);
      } else {
        roomsData = JSON.parse(JSON.stringify(initialData));
      }
      applyFilters();
    }

    function saveData() {
      localStorage.setItem('tv_check_data', JSON.stringify(roomsData));
      updateStats();
    }

    function isRoomDone(item) {
      return item.firmware && item.signal && item.label && item.roomNum;
    }

    function toggleAll(index, checkState) {
      roomsData[index].firmware = checkState;
      roomsData[index].signal = checkState;
      roomsData[index].label = checkState;
      roomsData[index].roomNum = checkState;

      if (checkState && !roomsData[index].remark.includes('Done')) {
        const todayStr = new Date().toLocaleDateString('th-TH');
        roomsData[index].remark = `Done (${todayStr})`;
      }

      saveData();
      applyFilters();
    }

    function updateCheck(index, field, value) {
      roomsData[index][field] = value;
      if (isRoomDone(roomsData[index]) && !roomsData[index].remark.includes('Done')) {
        const todayStr = new Date().toLocaleDateString('th-TH');
        roomsData[index].remark = `Done (${todayStr})`;
      }
      saveData();
      applyFilters();
    }

    function updateRemark(index, value) {
      roomsData[index].remark = value;
      saveData();
    }

    function updateStats() {
      const total = roomsData.length;
      const done = roomsData.filter(r => isRoomDone(r)).length;
      const pending = total - done;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;

      document.getElementById('statTotal').innerText = total;
      document.getElementById('statDone').innerText = done;
      document.getElementById('statPending').innerText = pending;
      document.getElementById('statProgress').innerText = `${pct}%`;
      document.getElementById('progressBar').style.width = `${pct}%`;
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('filterStatus').value;
      const availFilter = document.getElementById('filterAvailable').value;

      const filtered = roomsData.filter(r => {
        const matchSearch = r.room.toLowerCase().includes(search) || r.remark.toLowerCase().includes(search);
        
        let matchStatus = true;
        if (statusFilter === 'DONE') matchStatus = isRoomDone(r);
        if (statusFilter === 'PENDING') matchStatus = !isRoomDone(r);

        let matchAvail = true;
        if (availFilter === 'YES') matchAvail = (r.available === 'YES');
        if (availFilter === 'GUEST') matchAvail = r.remark.includes('Guest');

        return matchSearch && matchStatus && matchAvail;
      });

      renderTable(filtered);
      updateStats();
    }

    function renderTable(items) {
      const tbody = document.getElementById('roomTableBody');
      tbody.innerHTML = '';

      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-400">ไม่พบข้อมูลห้องพักที่ค้นหา</td></tr>`;
        return;
      }

      items.forEach((item) => {
        const originalIndex = roomsData.findIndex(r => r.room === item.room);
        const done = isRoomDone(item);
        
        const tr = document.createElement('tr');
        tr.className = `hover:bg-slate-50/80 transition-colors ${done ? 'bg-emerald-50/30' : ''}`;

        tr.innerHTML = `
          <td class="p-3.5 pl-5 font-bold text-slate-800 text-sm">${item.room}</td>
          <td class="p-3.5">
            <span class="px-2 py-0.5 rounded-md text-[10px] font-semibold ${item.available === 'YES' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}">
              ${item.available || 'N/A'}
            </span>
          </td>
          <td class="p-3.5 text-center"><input type="checkbox" class="custom-checkbox" ${item.firmware ? 'checked' : ''} onchange="updateCheck(${originalIndex}, 'firmware', this.checked)"></td>
          <td class="p-3.5 text-center"><input type="checkbox" class="custom-checkbox" ${item.signal ? 'checked' : ''} onchange="updateCheck(${originalIndex}, 'signal', this.checked)"></td>
          <td class="p-3.5 text-center"><input type="checkbox" class="custom-checkbox" ${item.label ? 'checked' : ''} onchange="updateCheck(${originalIndex}, 'label', this.checked)"></td>
          <td class="p-3.5 text-center"><input type="checkbox" class="custom-checkbox" ${item.roomNum ? 'checked' : ''} onchange="updateCheck(${originalIndex}, 'roomNum', this.checked)"></td>
          <td class="p-3.5">
            <input type="text" value="${item.remark || ''}" onchange="updateRemark(${originalIndex}, this.value)" placeholder="หมายเหตุ..." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-xs focus:outline-none focus:bg-white focus:ring-1 focus:ring-indigo-500">
          </td>
          <td class="p-3.5 text-center pr-5">
            <button onclick="toggleAll(${originalIndex}, ${!done})" class="text-[11px] font-medium px-2.5 py-1 rounded-lg border ${done ? 'border-amber-300 bg-amber-50 text-amber-700 hover:bg-amber-100' : 'border-emerald-300 bg-emerald-50 text-emerald-700 hover:bg-emerald-100'} transition">
              ${done ? 'ยกเลิกทั้งหมด' : 'ติ๊กถูกทั้งหมด'}
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportToExcel() {
      const exportRows = roomsData.map(r => ({
        'ROOM': r.room,
        'Available': r.available,
        'Firmware': r.firmware ? '✔' : '',
        'Signal': r.signal ? '✔' : '',
        'Label': r.label ? '✔' : '',
        'Room Number': r.roomNum ? '✔' : '',
        'Remark': r.remark
      }));

      const worksheet = XLSX.utils.json_to_sheet(exportRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "TV_Firmware_Check");
      
      const fileName = `TV_Firmware_Building_D_${new Date().toISOString().split('T')[0]}.xlsx`;
      XLSX.writeFile(workbook, fileName);
    }

    function resetData() {
      if (confirm('คุณต้องการรีเซ็ตข้อมูลทั้งหมดกลับเป็นค่าเริ่มต้นจากไฟล์ Excel หรือไม่?')) {
        localStorage.removeItem('tv_check_data');
        initData();
      }
    }

    initData();
  </script>
</body>
</html>
