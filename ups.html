<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPS & Battery Inspector</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .mini-card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .mini-btn { transition: all 0.2s ease; font-weight: 500; }
    .mini-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .mini-input { background-color: #ffffff !important; border: 1px solid #cbd5e1 !important; }
    .sidebar-link { transition: all 0.2s; }
    .sidebar-link.active { background-color: #0f172a; color: #ffffff; }
    .sidebar-link:not(.active):hover { background-color: #f1f5f9; color: #0f172a; }
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .toast-slide-in { animation: slideInRight 0.3s ease-out forwards; }
  </style>
</head>
<body class="min-h-screen flex bg-slate-50 antialiased">

  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <!-- 📌 SIDEBAR -->
  <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between shrink-0 hidden md:flex min-h-screen sticky top-0 self-start z-30 shadow-sm">
    <div class="p-5 space-y-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-emerald-600 text-white rounded-xl flex items-center justify-center text-lg font-bold">
          <i class="fa-solid fa-car-battery"></i>
        </div>
        <div>
          <h1 class="text-xs font-bold text-slate-900 uppercase">UPS INSPECTOR</h1>
          <p class="text-[11px] text-slate-400 mt-0.5">Management Portal</p>
        </div>
      </div>

      <div class="space-y-4">
        <div class="space-y-1">
          <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2">APPLICATIONS</p>
          <a href="index.html" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-600">
            <i class="fa-solid fa-list-check w-4"></i> IT Task & Shift
          </a>
          <a href="ups.html" class="sidebar-link active flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium">
            <i class="fa-solid fa-car-battery w-4 text-emerald-400"></i> UPS Inspector
          </a>
          <a href="inventory.html" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-600">
            <i class="fa-solid fa-desktop w-4 text-amber-500"></i> Asset Inventory
          </a>
        </div>
      </div>
    </div>

    <div class="p-4 border-t border-slate-100 bg-slate-50/80">
      <div class="flex items-center justify-between gap-2">
        <div class="overflow-hidden">
          <p id="userEmailDisplay" class="text-xs font-medium text-slate-800 truncate">it@layaresortphuket.com</p>
          <span class="text-[10px] text-emerald-600 uppercase font-semibold">STAFF</span>
        </div>
        <button onclick="handleLogout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 p-2 rounded-xl text-xs mini-btn shrink-0" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- 🖥️ MAIN CONTENT -->
  <main class="flex-1 p-4 md:p-8 mt-12 md:mt-0 max-w-6xl mx-auto space-y-6 w-full">
    <div class="mini-card p-6 md:p-8 space-y-6">
      
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-4">
        <div>
          <h2 class="text-lg font-semibold text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-car-battery text-emerald-600"></i> UPS & BATTERY INSPECTOR
          </h2>
          <p class="text-slate-500 text-xs mt-0.5">ระบบบันทึก ตรวจสอบพารามิเตอร์ไฟฟ้า และประวัติอุปกรณ์ UPS</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="exportToExcel()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 mini-btn text-xs px-3.5 py-2 rounded-xl flex items-center gap-1.5">
            <i class="fa-solid fa-file-excel"></i> Export Excel
          </button>
          <button onclick="toggleForm()" class="bg-slate-900 text-white mini-btn text-xs px-3.5 py-2 rounded-xl flex items-center gap-1.5">
            <i class="fa-solid fa-plus"></i> บันทึกผลตรวจ
          </button>
        </div>
      </div>

      <!-- FORM -->
      <div id="upsFormCard" class="hidden bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-4">
        <h3 class="text-xs font-bold text-slate-700 uppercase">บันทึกการตรวจเช็ก UPS ใหม่</h3>
        <form id="upsForm" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div><label class="block text-xs font-medium mb-1">Build (อาคาร)</label><input type="text" id="uBuild" required class="w-full mini-input rounded-xl p-2.5 text-xs"></div>
            <div><label class="block text-xs font-medium mb-1">Floor (ชั้น)</label><input type="text" id="uFloor" required class="w-full mini-input rounded-xl p-2.5 text-xs"></div>
            <div><label class="block text-xs font-medium mb-1">Side (ตำแหน่ง)</label><input type="text" id="uSide" class="w-full mini-input rounded-xl p-2.5 text-xs"></div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div><label class="block text-xs font-medium mb-1">UPS Model</label><input type="text" id="uUps" required value="SRVPM2KRIL" class="w-full mini-input rounded-xl p-2.5 text-xs"></div>
            <div><label class="block text-xs font-medium mb-1">UPS Serial No.</label><input type="text" id="uModelSerial" class="w-full mini-input rounded-xl p-2.5 text-xs"></div>
            <div><label class="block text-xs font-medium mb-1">Battery Model</label><input type="text" id="uBattery" value="SRV72RLBP-9A" class="w-full mini-input rounded-xl p-2.5 text-xs"></div>
            <div><label class="block text-xs font-medium mb-1">Battery Serial No.</label><input type="text" id="uBatterySerial" class="w-full mini-input rounded-xl p-2.5 text-xs"></div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-medium mb-1">Status</label>
              <select id="uStatus" class="w-full mini-input rounded-xl p-2.5 text-xs">
                <option value="OK">OK</option>
                <option value="Need Replace">Need Replace</option>
                <option value="Fault">Fault</option>
              </select>
            </div>
            <div><label class="block text-xs font-medium mb-1">Inspector</label><input type="text" id="uInspector" required class="w-full mini-input rounded-xl p-2.5 text-xs"></div>
            <div><label class="block text-xs font-medium mb-1">Inspection Date</label><input type="date" id="uDate" required class="w-full mini-input rounded-xl p-2.5 text-xs"></div>
          </div>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="toggleForm()" class="bg-white border border-slate-200 px-4 py-2 rounded-xl text-xs mini-btn">ยกเลิก</button>
            <button type="submit" class="bg-slate-900 text-white px-5 py-2 rounded-xl text-xs mini-btn">บันทึก</button>
          </div>
        </form>
      </div>

      <!-- FILTER -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
        <div>
          <label class="text-[11px] font-medium text-slate-500 mb-1 block">กรองตามอาคาร</label>
          <select id="filterBuild" onchange="renderTable()" class="w-full mini-input rounded-xl p-2 text-xs">
            <option value="">ทั้งหมดทุกอาคาร</option>
          </select>
        </div>
        <div>
          <label class="text-[11px] font-medium text-slate-500 mb-1 block">ค้นหาข้อมูล</label>
          <input type="text" id="searchUps" onkeyup="renderTable()" placeholder="ค้นหา S/N, ผู้ตรวจ, รุ่น..." class="w-full mini-input rounded-xl p-2 text-xs">
        </div>
      </div>

      <!-- TABLE -->
      <div class="overflow-x-auto rounded-xl border border-slate-100">
        <table class="w-full text-left text-xs text-slate-700">
          <thead class="bg-slate-50 text-[11px] uppercase border-b border-slate-100">
            <tr>
              <th class="p-3">BUILD/FLOOR</th>
              <th class="p-3">UPS MODEL</th>
              <th class="p-3">BATTERY</th>
              <th class="p-3 text-center">STATUS</th>
              <th class="p-3">INSPECTOR</th>
              <th class="p-3 text-center">ACTION</th>
            </tr>
          </thead>
          <tbody id="upsTableBody" class="divide-y divide-slate-100 bg-white"></tbody>
        </table>
      </div>

    </div>
  </main>

  <script>
    const AUTH_SUPABASE_URL = 'https://mpvyalurrgrymbvbmwcj.supabase.co';
    const AUTH_SUPABASE_KEY = 'sb_publishable_2sxnepbtIji-OK0ddOnQFA_cCin-yLu';
    const supabaseAuth = supabase.createClient(AUTH_SUPABASE_URL, AUTH_SUPABASE_KEY);

    const UPS_SUPABASE_URL = 'https://cnjatybztbzbouirjmya.supabase.co';
    const UPS_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuamF0eWJ6dGJ6Ym91aXJqbXlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTk0NTksImV4cCI6MjEwNDYzNTQ1OX0.xwv2hopsEBz7bwFPQ4USRVPixfgY21qECnXuDeoLkmU';
    const supabaseUps = supabase.createClient(UPS_SUPABASE_URL, UPS_SUPABASE_KEY);

    let rawRecords = [];

    async function checkAuth() {
      const { data: { user } } = await supabaseAuth.auth.getUser();
      if (user) {
        document.getElementById('userEmailDisplay').innerText = user.email;
        fetchRecords();
      } else { fetchRecords(); }
    }

    async function handleLogout() {
      await supabaseAuth.auth.signOut();
      window.location.href = 'index.html';
    }

    function toggleForm() {
      document.getElementById('upsFormCard').classList.toggle('hidden');
    }

    document.getElementById('uDate').value = new Date().toISOString().split('T')[0];

    document.getElementById('upsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        build: document.getElementById('uBuild').value,
        floor: document.getElementById('uFloor').value,
        side: document.getElementById('uSide').value,
        ups: document.getElementById('uUps').value,
        model_serial_no: document.getElementById('uModelSerial').value,
        battery: document.getElementById('uBattery').value,
        battery_model_serial_no: document.getElementById('uBatterySerial').value,
        status: document.getElementById('uStatus').value,
        inspector: document.getElementById('uInspector').value,
        inspection_date: document.getElementById('uDate').value
      };
      await supabaseUps.from('ups_inspections').insert([payload]);
      e.target.reset();
      toggleForm();
      fetchRecords();
    });

    async function fetchRecords() {
      const { data } = await supabaseUps.from('ups_inspections').select('*').order('created_at', { ascending: false });
      rawRecords = data || [];
      populateBuildFilter();
      renderTable();
    }

    function populateBuildFilter() {
      const select = document.getElementById('filterBuild');
      const builds = [...new Set(rawRecords.map(r => r.build).filter(Boolean))].sort();
      select.innerHTML = '<option value="">ทั้งหมดทุกอาคาร</option>';
      builds.forEach(b => { select.innerHTML += `<option value="${b}">${b}</option>`; });
    }

    function renderTable() {
      const build = document.getElementById('filterBuild').value;
      const search = document.getElementById('searchUps').value.toLowerCase();

      const filtered = rawRecords.filter(r => {
        const matchBuild = !build || r.build === build;
        const matchSearch = !search || [r.build, r.ups, r.model_serial_no, r.inspector, r.battery].join(' ').toLowerCase().includes(search);
        return matchBuild && matchSearch;
      });

      const tbody = document.getElementById('upsTableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">ไม่พบข้อมูลการตรวจเช็ก UPS</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(r => `
        <tr class="hover:bg-slate-50">
          <td class="p-3 font-semibold text-slate-900">${r.build || '-'}<br><span class="text-[10px] font-normal text-slate-500">Fl: ${r.floor || '-'} | ${r.side || '-'}</span></td>
          <td class="p-3"><b>${r.ups || '-'}</b><br><span class="text-[10px] text-slate-400">S/N: ${r.model_serial_no || '-'}</span></td>
          <td class="p-3">${r.battery || '-'}<br><span class="text-[10px] text-slate-400">S/N: ${r.battery_model_serial_no || '-'}</span></td>
          <td class="p-3 text-center"><span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold border ${r.status==='OK'?'bg-emerald-50 text-emerald-700 border-emerald-200':'bg-rose-50 text-rose-700 border-rose-200'}">${r.status || 'OK'}</span></td>
          <td class="p-3"><b>${r.inspector || '-'}</b><br><span class="text-[10px] text-slate-400">${r.inspection_date || '-'}</span></td>
          <td class="p-3 text-center"><button onclick="deleteRecord(${r.id})" class="text-rose-400 hover:text-rose-600 p-1"><i class="fa-solid fa-trash"></i></button></td>
        </tr>
      `).join('');
    }

    async function deleteRecord(id) {
      if (confirm('ยืนยันลบรายการนี้?')) {
        await supabaseUps.from('ups_inspections').delete().eq('id', id);
        fetchRecords();
      }
    }

    checkAuth();
  </script>
</body>
</html>
