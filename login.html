<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Authentication - IT Operations Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #0f172a; }
    .login-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
    .input-field { background-color: #0f172a !important; border: 1px solid #475569 !important; color: #f8fafc !important; }
    .input-field:focus { border-color: #3b82f6 !important; outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased text-slate-100">

  <div class="login-card p-6 md:p-8 max-w-md w-full space-y-6">
    <!-- LOGO & HEADER -->
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-2xl mx-auto shadow-lg shadow-blue-500/20">
        <i class="fa-solid fa-microchip"></i>
      </div>
      <h1 id="formHeaderTitle" class="text-xl font-bold tracking-tight text-white uppercase">IT OPERATIONS CENTER</h1>
      <p id="formHeaderDesc" class="text-slate-400 text-xs">กรุณากรอก Email และ Password เพื่อเข้าใช้งานระบบ</p>
    </div>

    <!-- ALERT BOX -->
    <div id="alertBox" class="hidden p-3 rounded-xl text-xs flex items-center gap-2">
      <i id="alertIcon" class="fa-solid text-sm shrink-0"></i>
      <span id="alertMessage">ข้อความแจ้งเตือน</span>
    </div>

    <!-- AUTH FORM -->
    <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
      <!-- EMAIL FIELD -->
      <div id="emailFieldGroup">
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Email Address</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-slate-500 text-xs"></i>
          <input type="email" id="email" placeholder="name@company.com" class="w-full input-field pl-9 rounded-xl p-2.5 text-xs">
        </div>
      </div>

      <!-- PASSWORD FIELD -->
      <div id="passwordFieldGroup">
        <div class="flex justify-between items-center mb-1.5">
          <label id="passLabel" class="block text-xs font-medium text-slate-300">Password</label>
          <button type="button" id="forgotBtn" onclick="switchMode('forgot')" class="text-[11px] text-blue-400 hover:underline">ลืมรหัสผ่าน?</button>
        </div>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-500 text-xs"></i>
          <input type="password" id="password" placeholder="••••••••" class="w-full input-field pl-9 rounded-xl p-2.5 text-xs">
        </div>
      </div>

      <!-- CONFIRM PASSWORD FIELD (ซ่อนเป็นค่าเริ่มต้น) -->
      <div id="confirmPasswordFieldGroup" class="hidden">
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Confirm Password (ยืนยันรหัสผ่าน)</label>
        <div class="relative">
          <i class="fa-solid fa-shield-halved absolute left-3.5 top-3 text-slate-500 text-xs"></i>
          <input type="password" id="confirmPassword" placeholder="••••••••" class="w-full input-field pl-9 rounded-xl p-2.5 text-xs">
        </div>
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl text-xs font-semibold transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20">
        <i class="fa-solid fa-right-to-bracket"></i> <span id="btnSubmitText">เข้าสู่ระบบ (Log In)</span>
      </button>
    </form>

    <!-- FOOTER TOGGLE MODE -->
    <div id="footerActionBox" class="text-center border-t border-slate-800 pt-4 space-y-2 text-xs">
      <div id="toggleSignupBox">
        <span class="text-slate-400">ยังไม่มีบัญชีใช่ไหม?</span>
        <button type="button" onclick="switchMode('signup')" class="text-blue-400 font-semibold hover:underline ml-1">สมัครสมาชิก</button>
      </div>
      <div id="toggleLoginBox" class="hidden">
        <span class="text-slate-400">มีบัญชีอยู่แล้ว?</span>
        <button type="button" onclick="switchMode('login')" class="text-blue-400 font-semibold hover:underline ml-1">กลับไปเข้าสู่ระบบ</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mpvyalurrgrymbvbmwcj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2sxnepbtIji-OK0ddOnQFA_cCin-yLu';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentMode = 'login'; // login | signup | forgot | reset

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('alertBox');
      const text = document.getElementById('alertMessage');
      const icon = document.getElementById('alertIcon');

      text.innerText = msg;
      box.classList.remove('hidden', 'bg-rose-500/10', 'border-rose-500/30', 'text-rose-400', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
      icon.classList.remove('fa-circle-exclamation', 'fa-circle-check');

      if (isSuccess) {
        box.classList.add('bg-emerald-500/10', 'border', 'border-emerald-500/30', 'text-emerald-400');
        icon.classList.add('fa-circle-check');
      } else {
        box.classList.add('bg-rose-500/10', 'border', 'border-rose-500/30', 'text-rose-400');
        icon.classList.add('fa-circle-exclamation');
      }
    }

    function hideAlert() {
      document.getElementById('alertBox').classList.add('hidden');
    }

    function switchMode(mode) {
      currentMode = mode;
      hideAlert();

      const emailGroup = document.getElementById('emailFieldGroup');
      const emailInput = document.getElementById('email');
      const passGroup = document.getElementById('passwordFieldGroup');
      const passInput = document.getElementById('password');
      const confirmPassGroup = document.getElementById('confirmPasswordFieldGroup');
      const confirmPassInput = document.getElementById('confirmPassword');
      const passLabel = document.getElementById('passLabel');
      const forgotBtn = document.getElementById('forgotBtn');
      const title = document.getElementById('formHeaderTitle');
      const desc = document.getElementById('formHeaderDesc');
      const btnText = document.getElementById('btnSubmitText');
      const toggleSignup = document.getElementById('toggleSignupBox');
      const toggleLogin = document.getElementById('toggleLoginBox');
      const footerBox = document.getElementById('footerActionBox');

      // ล้างค่าในช่องกรอก
      confirmPassInput.value = '';

      if (mode === 'login') {
        title.innerText = 'IT OPERATIONS CENTER';
        desc.innerText = 'กรุณากรอก Email และ Password เพื่อเข้าใช้งานระบบ';
        btnText.innerText = 'เข้าสู่ระบบ (Log In)';
        emailGroup.classList.remove('hidden');
        emailInput.required = true;
        passGroup.classList.remove('hidden');
        passInput.required = true;
        confirmPassGroup.classList.add('hidden');
        confirmPassInput.required = false;
        passLabel.innerText = 'Password';
        forgotBtn.classList.remove('hidden');
        footerBox.classList.remove('hidden');
        toggleSignup.classList.remove('hidden');
        toggleLogin.classList.add('hidden');
      } else if (mode === 'signup') {
        title.innerText = 'CREATE NEW ACCOUNT';
        desc.innerText = 'สมัครสมาชิกใหม่สำหรับเจ้าหน้าที่ IT';
        btnText.innerText = 'ยืนยันการสมัครสมาชิก (Sign Up)';
        emailGroup.classList.remove('hidden');
        emailInput.required = true;
        passGroup.classList.remove('hidden');
        passInput.required = true;
        confirmPassGroup.classList.remove('hidden');
        confirmPassInput.required = true;
        passLabel.innerText = 'Password';
        forgotBtn.classList.add('hidden');
        footerBox.classList.remove('hidden');
        toggleSignup.classList.add('hidden');
        toggleLogin.classList.remove('hidden');
      } else if (mode === 'forgot') {
        title.innerText = 'RESET PASSWORD';
        desc.innerText = 'ระบบจะส่งลิงก์รีเซ็ตรหัสผ่านไปยัง Email ของคุณ';
        btnText.innerText = 'ส่งลิงก์ตั้งรหัสผ่านใหม่ (Reset Password)';
        emailGroup.classList.remove('hidden');
        emailInput.required = true;
        passGroup.classList.add('hidden');
        passInput.required = false;
        confirmPassGroup.classList.add('hidden');
        confirmPassInput.required = false;
        footerBox.classList.remove('hidden');
        toggleSignup.classList.add('hidden');
        toggleLogin.classList.remove('hidden');
      } else if (mode === 'reset') {
        title.innerText = 'SET NEW PASSWORD';
        desc.innerText = 'กรุณากรอกรหัสผ่านใหม่ที่คุณต้องการใช้งาน';
        btnText.innerText = 'บันทึกรหัสผ่านใหม่ (Save Password)';
        emailGroup.classList.add('hidden');
        emailInput.required = false;
        passGroup.classList.remove('hidden');
        passInput.required = true;
        confirmPassGroup.classList.remove('hidden');
        confirmPassInput.required = true;
        passLabel.innerText = 'New Password';
        forgotBtn.classList.add('hidden');
        footerBox.classList.add('hidden');
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // 🛡️ ตรวจสอบว่า Confirm Password ตรงกันหรือไม่ (กรณี Signup หรือ Reset Password)
      if (currentMode === 'signup' || currentMode === 'reset') {
        if (password !== confirmPassword) {
          showAlert('รหัสผ่านและช่องยืนยันรหัสผ่านไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง', false);
          return;
        }
        if (password.length < 6) {
          showAlert('รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร', false);
          return;
        }
      }

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> กำลังดำเนินการ...`;

      try {
        if (currentMode === 'login') {
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          window.location.href = 'index.html';
        } 
        else if (currentMode === 'signup') {
          const { error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;
          showAlert('สมัครสมาชิกสำเร็จ! โปรดเช็ก Inbox ในอีเมลของคุณ', true);
        } 
        else if (currentMode === 'forgot') {
          const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + window.location.pathname,
          });
          if (error) throw error;
          showAlert('ส่งลิงก์รีเซ็ตรหัสผ่านไปยังอีเมลเรียบร้อยแล้ว!', true);
        }
        else if (currentMode === 'reset') {
          const { error } = await supabaseClient.auth.updateUser({ password: password });
          if (error) throw error;
          showAlert('อัปเดตรหัสผ่านใหม่เรียบร้อยแล้ว! กำลังพาท่านเข้าสู่ระบบ...', true);
          setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        }
      } catch (err) {
        let errorMsg = err.message || 'เกิดข้อผิดพลาดในการทำรายการ';
        if (errorMsg.includes('Invalid login credentials')) {
          errorMsg = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง (หากยังไม่มีบัญชีให้กด สมัครสมาชิก)';
        }
        showAlert(errorMsg, false);
      } finally {
        btn.disabled = false;
        const labelMap = { 
          login: 'เข้าสู่ระบบ (Log In)', 
          signup: 'ยืนยันการสมัครสมาชิก (Sign Up)', 
          forgot: 'ส่งลิงก์ตั้งรหัสผ่านใหม่ (Reset Password)',
          reset: 'บันทึกรหัสผ่านใหม่ (Save Password)'
        };
        btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> <span>${labelMap[currentMode]}</span>`;
      }
    }

    async function checkAuthStatus() {
      supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
          switchMode('reset');
          return;
        }
      });

      const { data: { user } } = await supabaseClient.auth.getUser();
      const hash = window.location.hash;
      if (user && !hash.includes('type=recovery')) {
        window.location.href = 'index.html';
      }
    }

    checkAuthStatus();
  </script>
</body>
</html>
